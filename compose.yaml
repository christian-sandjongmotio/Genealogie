services:
  postgres:
    image: postgres:17-alpine
    container_name: memoire-familiale-db
    environment:
      POSTGRES_DB: genealogie
      POSTGRES_USER: genealogie
      POSTGRES_PASSWORD: genealogie
    ports:
      - "5433:5432"
    volumes:
      - genealogie_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genealogie -d genealogie"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  genealogie_data:
